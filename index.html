<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarita Sarees | Timeless Elegance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #0e090b;
            color: #fff;
            overflow-x: hidden;
        }
        /* =========================
           NAVBAR
        ========================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(14, 9, 11, 0.72);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #e8b96b;
        }
        .logo span {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 5px;
            color: #aaa;
            margin-top: 2px;
        }
        nav {
            display: flex;
            gap: 35px;
        }
        nav a {
            color: #ddd;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }
        nav a:hover {
            color: #e8b96b;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cart-button {
            position: relative;
            padding: 11px 17px;
            border-radius: 30px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: 0.3s;
        }
        .cart-button:hover {
            background: #b88645;
            transform: translateY(-2px);
        }
        .cart-count {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 21px;
            height: 21px;
            border-radius: 50%;
            background: #d89b4b;
            color: #120b0c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }
        /* =========================
           HERO
        ========================= */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 130px 8% 80px;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 80% 40%,
                    rgba(142,82,50,0.32),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(102,40,57,0.2),
                    transparent 35%
                );
        }
        .hero::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 1px solid rgba(232,185,107,0.15);
            right: 3%;
            top: 15%;
            transform: rotateX(65deg);
            box-shadow:
                0 0 100px rgba(232,185,107,0.08);
        }
        .hero-text {
            width: 50%;
            position: relative;
            z-index: 2;
        }
        .eyebrow {
            color: #dca45e;
            font-family: Arial, sans-serif;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 11px;
            margin-bottom: 20px;
        }
        .hero h1 {
            font-size: clamp(50px, 7vw, 90px);
            line-height: 0.95;
            font-weight: normal;
            margin-bottom: 25px;
        }
        .hero h1 span {
            color: #dca45e;
            font-style: italic;
        }
        .hero-description {
            color: #aaa;
            font-family: Arial, sans-serif;
            max-width: 500px;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 35px;
        }
        .hero-btn {
            display: inline-block;
            padding: 16px 30px;
            border-radius: 30px;
            text-decoration: none;
            background:
                linear-gradient(
                    135deg,
                    #e0ae65,
                    #a66b32
                );
            color: #160e0b;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow:
                0 15px 35px rgba(190,130,60,0.25);
            transition: 0.3s;
        }
        .hero-btn:hover {
            transform: translateY(-4px);
            box-shadow:
                0 20px 45px rgba(190,130,60,0.4);
        }
        /* =========================
           3D SAREE DISPLAY
        ========================= */
        .hero-visual {
            width: 50%;
            height: 600px;
            position: relative;
            perspective: 1200px;
        }
        .saree-card {
            position: absolute;
            width: 300px;
            height: 430px;
            right: 12%;
            top: 10%;
            border-radius: 20px;
            overflow: hidden;
            transform-style: preserve-3d;
            transform:
                rotateY(-18deg)
                rotateX(7deg)
                rotateZ(2deg);
            box-shadow:
                -35px 40px 70px rgba(0,0,0,0.6);
            transition: transform 0.5s ease;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .saree-card:hover {
            transform:
                rotateY(-8deg)
                rotateX(2deg)
                rotateZ(0deg)
                translateY(-10px)
                scale(1.03);
        }
        .saree-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .floating-card {
            position: absolute;
            width: 190px;
            height: 230px;
            left: 8%;
            bottom: 15%;
            overflow: hidden;
            border-radius: 18px;
            transform:
                rotateY(20deg)
                rotateX(8deg);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow:
                0 30px 60px rgba(0,0,0,0.5);
            animation: floating 5s ease-in-out infinite;
        }
        .floating-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes floating {
            0%,100% {
                transform:
                    rotateY(20deg)
                    rotateX(8deg)
                    translateY(0);
            }
            50% {
                transform:
                    rotateY(20deg)
                    rotateX(8deg)
                    translateY(-18px);
            }
        }
        /* =========================
           SECTION
        ========================= */
        .section {
            padding: 100px 7%;
        }
        .section-heading {
            text-align: center;
            margin-bottom: 50px;
        }
        .section-heading small {
            color: #dca45e;
            font-family: Arial, sans-serif;
            letter-spacing: 4px;
            font-size: 10px;
        }
        .section-heading h2 {
            font-size: 45px;
            font-weight: normal;
            margin-top: 10px;
        }
        /* =========================
           FILTER BAR
        ========================= */
        .shop-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .category {
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #aaa;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: 0.3s;
        }
        .category:hover,
        .category.active {
            background: #b77b3f;
            color: white;
            border-color: #b77b3f;
        }
        .search {
            width: 240px;
            padding: 13px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            outline: none;
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: Arial, sans-serif;
        }
        /* =========================
           PRODUCTS
        ========================= */
        .products {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);
            gap: 25px;
        }
        .product {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    #1b1214,
                    #100b0c
                );
            border: 1px solid rgba(255,255,255,0.08);
            transition:
                transform 0.4s,
                box-shadow 0.4s;
            transform-style: preserve-3d;
        }
        .product:hover {
            transform:
                translateY(-10px)
                rotateX(2deg);
            box-shadow:
                0 30px 60px rgba(0,0,0,0.4);
        }
        .product-image {
            height: 340px;
            overflow: hidden;
            position: relative;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }
        .product:hover .product-image img {
            transform: scale(1.08);
        }
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(20,10,10,0.8);
            color: #e9bb77;
            font-family: Arial, sans-serif;
            font-size: 10px;
        }
        .product-info {
            padding: 20px;
        }
        .product-info h3 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 8px;
        }
        .product-info p {
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price {
            color: #e5b56e;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .add-btn {
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            background: #d29a55;
            color: #170e0b;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .add-btn:hover {
            transform: scale(1.05);
            background: #f0bd75;
        }
        /* =========================
           STORY SECTION
        ========================= */
        .story {
            min-height: 500px;
            display: flex;
            align-items: center;
            gap: 70px;
        }
        .story-image {
            width: 45%;
            height: 450px;
            border-radius: 25px;
            overflow: hidden;
            transform:
                perspective(1000px)
                rotateY(8deg);
            box-shadow:
                30px 30px 70px rgba(0,0,0,0.5);
        }
        .story-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .story-text {
            width: 55%;
        }
        .story-text small {
            color: #dca45e;
            letter-spacing: 4px;
            font-family: Arial, sans-serif;
            font-size: 10px;
        }
        .story-text h2 {
            font-size: 50px;
            font-weight: normal;
            margin: 15px 0 25px;
        }
        .story-text p {
            color: #999;
            font-family: Arial, sans-serif;
            line-height: 1.9;
            font-size: 14px;
            max-width: 600px;
        }
        /* =========================
           FOOTER
        ========================= */
        footer {
            padding: 50px 7%;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            color: #777;
            font-family: Arial, sans-serif;
        }
        footer strong {
            color: #dca45e;
        }
        /* =========================
           TOAST
        ========================= */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 22px;
            border-radius: 12px;
            background: #241619;
            border: 1px solid rgba(220,164,94,0.4);
            color: white;
            font-family: Arial, sans-serif;
            transform:
                translateY(100px);
            opacity: 0;
            transition: 0.4s;
            z-index: 2000;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        /* =========================
           RESPONSIVE
        ========================= */
        @media(max-width: 1000px) {
            .products {
                grid-template-columns:
                    repeat(2, 1fr);
            }
            .hero-text {
                width: 55%;
            }
            .hero-visual {
                width: 45%;
            }
            nav {
                display: none;
            }
        }
        @media(max-width: 700px) {
            header {
                padding: 15px 5%;
            }
            .hero {
